<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آزمایشگاه و درسنامه جامع طیف‌سنجی NMR</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
  <style>
    :root {
      --font-sans: 'Vazirmatn', 'Vazir', 'IRANSans', 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
      --bg-app: #f6f7fb; --bg-surface: #ffffff; --bg-elevated: #f0f3f9; --bg-hover: #e8edf7;
      --text-primary: #141b2d; --text-secondary: #4a5568; --text-muted: #718096; --border-color: #dce3f0;
      --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: rgba(37, 99, 235, 0.10);
      --exam-accent: #d97706; --exam-soft: rgba(217, 119, 6, 0.12);
      --deep-accent: #7c3aed; --deep-soft: rgba(124, 58, 237, 0.09);
      --success: #059669; --success-soft: rgba(5, 150, 105, 0.12);
      --danger: #dc2626; --danger-soft: rgba(220, 38, 38, 0.12);
      --warning: #ca8a04; --warning-soft: rgba(202, 138, 4, 0.12);
      --sidebar-w: 272px; --header-h: 64px;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.16);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg-app: #0c111d; --bg-surface: #131b2e; --bg-elevated: #1b263f; --bg-hover: #243252;
      --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #94a3b8; --border-color: #263452;
      --accent: #60a5fa; --accent-hover: #3b82f6; --accent-soft: rgba(96, 165, 250, 0.14);
      --exam-accent: #f59e0b; --exam-soft: rgba(245, 158, 11, 0.15);
      --deep-accent: #a78bfa; --deep-soft: rgba(167, 139, 250, 0.14);
      --success: #34d399; --success-soft: rgba(52, 211, 153, 0.14);
      --danger: #f87171; --danger-soft: rgba(248, 113, 113, 0.14);
      --warning: #facc15; --warning-soft: rgba(250, 204, 21, 0.14);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.5);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; font-family: var(--font-sans);
      background: var(--bg-app); color: var(--text-primary);
      line-height: 1.75; font-size: 15px; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    h1, h2, h3, h4 { margin: 0 0 0.65rem; line-height: 1.4; font-weight: 700; color: var(--text-primary); }
    h1 { font-size: 1.65rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; }
    p { margin: 0 0 0.9rem; color: var(--text-secondary); }
    a { color: var(--accent); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    bdi, .ltr, .formula, code { direction: ltr; unicode-bidi: isolate; font-family: var(--font-mono); }
    .formula-box {
      direction: ltr; unicode-bidi: isolate; font-family: var(--font-mono);
      background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
      padding: 0.75rem 1rem; margin: 0.75rem 0; text-align: center; font-size: 0.98rem; color: var(--text-primary); overflow-x: auto;
    }
    code { background: var(--bg-elevated); padding: 0.12rem 0.4rem; border-radius: 5px; font-size: 0.88em; color: var(--accent); }

    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      position: fixed; top: 0; right: 0; width: var(--sidebar-w); height: 100vh;
      background: var(--bg-surface); border-left: 1px solid var(--border-color);
      display: flex; flex-direction: column; z-index: 100; transition: transform var(--transition);
    }
    .sidebar-brand {
      height: var(--header-h); padding: 0 1.2rem; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border-color);
    }
    .brand-title { display: flex; align-items: center; gap: 0.65rem; font-weight: 800; font-size: 1.05rem; color: var(--text-primary); }
    .brand-logo {
      width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--deep-accent));
      color: #fff; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
    }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 0.85rem 0.75rem; }
    .nav-group-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); padding: 0.65rem 0.65rem 0.3rem; }
    .nav-item {
      width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between;
      gap: 0.6rem; padding: 0.55rem 0.8rem; margin-bottom: 0.25rem; border: 1px solid transparent;
      border-radius: var(--radius-sm); background: transparent; color: var(--text-secondary);
      font-size: 0.92rem; font-weight: 500; text-align: right; transition: all var(--transition);
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(37, 99, 235, 0.22); font-weight: 700; }
    .nav-item-main { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .nav-item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-badge { font-size: 0.72rem; font-family: var(--font-mono); padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--bg-elevated); color: var(--text-muted); flex-shrink: 0; }
    .nav-item.done .nav-badge { background: var(--success-soft); color: var(--success); }
    .sidebar-footer { padding: 0.85rem 1rem; border-top: 1px solid var(--border-color); background: var(--bg-elevated); }
    .mini-progress-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .progress-bar { width: 100%; height: 8px; background: var(--border-color); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 999px; transition: width 0.35s ease; }

    .main-wrapper { flex: 1; margin-right: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; }
    .top-header {
      position: sticky; top: 0; height: var(--header-h); background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color); padding: 0 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; z-index: 80;
    }
    .header-right, .header-left { display: flex; align-items: center; gap: 0.6rem; }
    .icon-btn {
      min-height: 40px; min-width: 40px; padding: 0 0.75rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary);
      display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
      font-size: 0.86rem; font-weight: 600; transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .icon-btn.exam-active { background: var(--exam-soft); border-color: var(--exam-accent); color: var(--exam-accent); }
    .menu-toggle { display: none; }
    .search-trigger {
      min-height: 40px; padding: 0 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
      background: var(--bg-elevated); color: var(--text-muted); display: inline-flex; align-items: center;
      gap: 0.6rem; font-size: 0.85rem; transition: all var(--transition);
    }
    .search-trigger:hover { border-color: var(--accent); color: var(--text-primary); }
    .kbd { font-family: var(--font-mono); font-size: 0.74rem; padding: 0.1rem 0.35rem; border-radius: 5px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); }
    .main-content { max-width: 1080px; width: 100%; margin: 0 auto; padding: 1.5rem 1.4rem 5rem; }

    .card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.15rem; box-shadow: var(--shadow-sm); }
    .card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.9rem; padding-bottom: 0.7rem; border-bottom: 1px solid var(--border-color); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .btn {
      min-height: 44px; padding: 0.55rem 1.1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
      background: var(--bg-surface); color: var(--text-primary); font-size: 0.9rem; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all var(--transition);
    }
    .btn:hover:not(:disabled) { background: var(--bg-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-warning { background: var(--exam-accent); border-color: var(--exam-accent); color: #fff; }
    .btn-sm { min-height: 36px; padding: 0.35rem 0.75rem; font-size: 0.82rem; }

    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.18rem 0.6rem; border-radius: 999px; font-size: 0.76rem; font-weight: 700; }
    .badge-core { background: var(--exam-soft); color: var(--exam-accent); }
    .badge-deep { background: var(--deep-soft); color: var(--deep-accent); }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-info { background: var(--accent-soft); color: var(--accent); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }

    .callout { border-radius: var(--radius-sm); padding: 0.95rem 1.1rem; margin: 0.9rem 0; border-right: 4px solid var(--accent); background: var(--accent-soft); }
    .callout.exam-core { border-right-color: var(--exam-accent); background: var(--exam-soft); }
    .callout.warning { border-right-color: var(--danger); background: var(--danger-soft); }
    .callout.success { border-right-color: var(--success); background: var(--success-soft); }

    .deep-learning { border: 1px solid var(--border-color); border-right: 4px solid var(--deep-accent); border-radius: var(--radius-sm); background: var(--bg-surface); margin: 0.95rem 0; overflow: hidden; }
    .deep-learning-header { width: 100%; padding: 0.75rem 1rem; background: var(--deep-soft); border: none; display: flex; align-items: center; justify-content: space-between; color: var(--deep-accent); font-weight: 700; font-size: 0.92rem; text-align: right; }
    .deep-learning-body { padding: 1rem 1.1rem; border-top: 1px solid var(--border-color); }
    .deep-learning .chevron { transition: transform var(--transition); display: inline-block; }
    body.exam-mode .deep-learning:not(.dl-open) .deep-learning-body { display: none; }
    body.exam-mode .deep-learning:not(.dl-open) .chevron { transform: rotate(180deg); }
    body:not(.exam-mode) .deep-learning.dl-closed .deep-learning-body { display: none; }
    body:not(.exam-mode) .deep-learning.dl-closed .chevron { transform: rotate(180deg); }

    .exam-mode-banner {
      display: none; background: var(--exam-soft); border: 1px solid var(--exam-accent); color: var(--exam-accent);
      padding: 0.65rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.88rem;
      font-weight: 600; align-items: center; justify-content: space-between; gap: 0.75rem;
    }
    body.exam-mode .exam-mode-banner { display: flex; }

    .tabs-bar { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .tab-btn { min-height: 40px; padding: 0.4rem 0.9rem; border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--text-secondary); font-weight: 600; font-size: 0.88rem; transition: all var(--transition); }
    .tab-btn:hover { background: var(--bg-hover); }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(37, 99, 235, 0.25); }

    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin: 0.8rem 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--border-color); text-align: right; }
    th { background: var(--bg-elevated); font-weight: 700; color: var(--text-primary); }
    tr:last-child td { border-bottom: none; }

    .flashcard-stage { perspective: 1100px; margin: 1rem 0; }
    .flashcard-inner { position: relative; min-height: 210px; width: 100%; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer; }
    .flashcard-inner.flipped { transform: rotateY(180deg); }
    .flashcard-face {
      position: absolute; inset: 0; backface-visibility: hidden; background: var(--bg-elevated);
      border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    .flashcard-back { transform: rotateY(180deg); background: var(--bg-surface); border-color: var(--accent); }
    .fc-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin-top: 1rem; }

    .quiz-timer { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 800; padding: 0.35rem 0.8rem; border-radius: var(--radius-sm); background: var(--danger-soft); color: var(--danger); direction: ltr; }
    .quiz-option {
      width: 100%; min-height: 46px; padding: 0.7rem 1rem; margin-bottom: 0.55rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary);
      text-align: right; display: flex; align-items: center; gap: 0.75rem; font-size: 0.92rem; transition: all var(--transition);
    }
    .quiz-option:hover:not(:disabled) { border-color: var(--accent); background: var(--bg-hover); }
    .quiz-option.selected { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

    .nmr-widget { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem; margin: 1rem 0; }
    .nmr-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.75rem; }
    .nmr-svg-wrap { width: 100%; overflow-x: auto; background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.5rem; }
    .nmr-svg { width: 100%; min-width: 560px; height: auto; display: block; }
    .nmr-peak-group { cursor: pointer; transition: opacity 0.2s ease; }
    .nmr-peak-group.dimmed { opacity: 0.28; }
    .nmr-peak-group.highlighted .peak-path { stroke-width: 2.8; filter: drop-shadow(0 0 4px currentColor); }
    .mol-group-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.7rem; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-elevated); font-size: 0.83rem; font-weight: 600; cursor: pointer; transition: all var(--transition); }
    .mol-group-pill.active, .mol-group-pill:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .nmr-info-bar { margin-top: 0.75rem; padding: 0.75rem 0.95rem; border-radius: var(--radius-sm); background: var(--bg-elevated); border: 1px solid var(--border-color); font-size: 0.88rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem; }

    .fab-cheat {
      position: fixed; bottom: 1.35rem; left: 1.35rem; z-index: 90; min-height: 48px; padding: 0 1.15rem;
      border-radius: 999px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem;
      box-shadow: var(--shadow-lg); display: inline-flex; align-items: center; gap: 0.5rem; transition: all var(--transition);
    }
    .fab-cheat:hover:not(:disabled) { transform: translateY(-2px); background: var(--accent-hover); }
    .fab-cheat:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.75; }
    .drawer-backdrop, .modal-backdrop { position: fixed; inset: 0; background: rgba(10, 15, 28, 0.55); backdrop-filter: blur(3px); z-index: 150; display: none; align-items: center; justify-content: center; }
    .drawer-backdrop.open, .modal-backdrop.open { display: flex; }
    .cheat-drawer { position: fixed; top: 0; left: 0; width: min(520px, 94vw); height: 100vh; background: var(--bg-surface); border-right: 1px solid var(--border-color); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; z-index: 160; transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
    .cheat-drawer.open { transform: translateX(0); }
    .drawer-header { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 1rem 1.2rem 2rem; }

    .search-modal { width: min(640px, 92vw); max-height: 80vh; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
    .search-input-wrap { padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.75rem; }
    .search-input { flex: 1; border: none; outline: none; background: transparent; color: var(--text-primary); font-family: inherit; font-size: 1rem; }
    .search-results { overflow-y: auto; padding: 0.6rem; max-height: 62vh; }
    .search-hit { width: 100%; padding: 0.7rem 0.9rem; border-radius: var(--radius-sm); border: none; background: transparent; text-align: right; display: flex; flex-direction: column; gap: 0.2rem; color: var(--text-primary); }
    .search-hit:hover { background: var(--bg-hover); }
    .search-hit-meta { font-size: 0.76rem; color: var(--text-muted); }

    .toast { position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 200; background: var(--text-primary); color: var(--bg-surface); padding: 0.7rem 1.1rem; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transform: translateY(10px); transition: all 0.25s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(10, 15, 28, 0.5); z-index: 95; }
    .sidebar-backdrop.open { display: block; }

    @media (max-width: 960px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrapper { margin-right: 0; }
      .menu-toggle { display: inline-flex; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .main-content { padding: 1rem 0.9rem 5.5rem; }
      .search-trigger .search-text, .search-trigger .kbd { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="UI.toggleSidebar(false)"></div>
    <aside id="sidebar" class="sidebar" aria-label="ناوبری اصلی">
      <div class="sidebar-brand">
        <div class="brand-title"><div class="brand-logo">NMR</div><span>طیف‌سنجی NMR</span></div>
        <button class="icon-btn menu-toggle" onclick="UI.toggleSidebar(false)" aria-label="بستن منو">✕</button>
      </div>
      <nav id="sidebarNav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="mini-progress-row"><span>پیشرفت کل دوره</span><bdi id="sidebarProgressPct">0%</bdi></div>
        <div class="progress-bar"><div id="sidebarProgressFill" class="progress-fill" style="width:0%;"></div></div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-right">
          <button class="icon-btn menu-toggle" onclick="UI.toggleSidebar(true)" aria-label="باز کردن منو">☰</button>
          <button class="search-trigger" onclick="SearchEngine.open()" title="جستجوی فوری (Ctrl+K)">
            <span>🔍</span><span class="search-text">جستجو در کل درسنامه و آزمون‌ها...</span><span class="kbd"><bdi>Ctrl+K</bdi></span>
          </button>
        </div>
        <div class="header-left">
          <button id="examModeBtn" class="icon-btn" onclick="AppState.toggleExamMode()" title="بستن خودکار بخش‌های تحلیل عمیق برای مرور شب امتحان"><span>⚡</span><span>حالت شب امتحان</span></button>
          <button id="themeToggleBtn" class="icon-btn" onclick="AppState.toggleTheme()" title="تغییر تم روشن/تاریک" aria-label="تغییر تم">🌙</button>
        </div>
      </header>
      <main class="main-content">
        <div class="exam-mode-banner">
          <span>⚡ حالت شب امتحان فعال است: بلوک‌های تحلیل عمیق (<code>.deep-learning</code>) بسته شدند تا فقط نکات کلیدی و امتحانی برجسته باشند.</span>
          <button class="btn btn-sm" onclick="AppState.toggleExamMode()">خروج از حالت امتحان</button>
        </div>
        <div id="appView"></div>
      </main>
    </div>
  </div>

  <button id="fabCheat" class="fab-cheat" onclick="CheatSheet.toggle(true)"><span>📑</span><span>مرجع سریع NMR</span></button>
  <div id="cheatBackdrop" class="drawer-backdrop" onclick="CheatSheet.toggle(false)"></div>
  <aside id="cheatDrawer" class="cheat-drawer" aria-label="مرجع سریع طیف‌سنجی NMR">
    <div class="drawer-header">
      <h3 style="margin:0;">📑 کشوی مرجع سریع (Cheat Sheet)</h3>
      <button class="icon-btn" onclick="CheatSheet.toggle(false)" aria-label="بستن">✕</button>
    </div>
    <div class="drawer-body">
      <div class="tabs-bar" id="cheatTabs">
        <button class="tab-btn active" onclick="CheatSheet.switchTab('h1', this)"><bdi>¹H ppm</bdi></button>
        <button class="tab-btn" onclick="CheatSheet.switchTab('c13', this)"><bdi>¹³C & DEPT</bdi></button>
        <button class="tab-btn" onclick="CheatSheet.switchTab('solvents', this)">حلال‌ها</button>
        <button class="tab-btn" onclick="CheatSheet.switchTab('formulas', this)">فرمول‌ها</button>
      </div>
      <div id="cheatContent"></div>
    </div>
  </aside>

  <div id="searchModalBackdrop" class="modal-backdrop" onclick="if(event.target===this) SearchEngine.close()">
    <div class="search-modal" role="dialog" aria-modal="true" aria-label="جستجوی فوری">
      <div class="search-input-wrap">
        <span>🔍</span>
        <input id="globalSearchInput" class="search-input" type="text" placeholder="عبارت مورد نظر را تایپ کنید (مثلاً: DEPT، لارمور، CDCl3، کارپلاس)..." oninput="SearchEngine.run(this.value)" />
        <button class="icon-btn btn-sm" onclick="SearchEngine.close()">Esc</button>
      </div>
      <div id="globalSearchResults" class="search-results"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    /* =========================================================
       1. CORE DATA STORE & REGISTRATION HELPERS
       ========================================================= */
    const COURSE_DATA = {
      meta: {
        title: 'طیف‌سنجی رزونانس مغناطیسی هسته‌ای (NMR)',
        subtitle: 'درسنامه یکپارچه، آزمایشگاه ۱۷ شبیه‌ساز تعاملی و بانک جامع آزمون — آنالیز دستگاهی ۲ (دکتر مرادی)',
        totalSessions: 7
      },
      sessions: [],
      simulators: [],
      examBank: { historical: [], examples: [], practice: [] }
    };
    function registerSession(s) {
      const i = COURSE_DATA.sessions.findIndex(x => x.id === s.id);
      if (i >= 0) COURSE_DATA.sessions[i] = s; else COURSE_DATA.sessions.push(s);
      COURSE_DATA.sessions.sort((a, b) => a.number - b.number);
    }
    function registerSimulator(sim) {
      const i = COURSE_DATA.simulators.findIndex(x => x.id === sim.id);
      if (i >= 0) COURSE_DATA.simulators[i] = sim; else COURSE_DATA.simulators.push(sim);
    }
    function registerExamBank(p) {
      if (Array.isArray(p.historical)) COURSE_DATA.examBank.historical.push(...p.historical);
      if (Array.isArray(p.examples)) COURSE_DATA.examBank.examples.push(...p.examples);
      if (Array.isArray(p.practice)) COURSE_DATA.examBank.practice.push(...p.practice);
    }

    /* =========================================================
       2. PERSISTENT STATE ENGINE
       ========================================================= */
    const STORAGE_KEY = 'nmr_spa_state_v1';
    const AppState = {
      data: { theme: 'light', examMode: false, completedSections: {}, completedSessions: {}, flashcards: {}, quizHistory: [] },
      timedExamActive: false,
      load() {
        try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) this.data = Object.assign({}, this.data, JSON.parse(raw)); } catch {}
        this.applyPreferences();
      },
      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
          if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === 'function') window.notebookAppApi.setAppState(this.data);
        } catch {}
        UI.updateGlobalProgress();
      },
      applyPreferences() {
        document.documentElement.setAttribute('data-theme', this.data.theme);
        document.getElementById('themeToggleBtn').textContent = this.data.theme === 'dark' ? '☀️' : '🌙';
        document.body.classList.toggle('exam-mode', !!this.data.examMode);
        document.getElementById('examModeBtn').classList.toggle('exam-active', !!this.data.examMode);
      },
      toggleTheme() { this.data.theme = this.data.theme === 'dark' ? 'light' : 'dark'; this.applyPreferences(); this.save(); },
      toggleExamMode() { this.data.examMode = !this.data.examMode; this.applyPreferences(); this.save(); UI.toast(this.data.examMode ? 'حالت شب امتحان فعال شد' : 'حالت مطالعه کامل فعال شد'); },
      toggleSessionDone(n) { if (this.data.completedSessions[n]) delete this.data.completedSessions[n]; else this.data.completedSessions[n] = true; this.save(); Router.renderSidebar(); },
      setFlashcardMastery(id, lvl) { this.data.flashcards[id] = lvl; this.save(); },
      recordQuiz(entry) { this.data.quizHistory.unshift({ ...entry, date: new Date().toLocaleDateString('fa-IR') }); if (this.data.quizHistory.length > 40) this.data.quizHistory.pop(); this.save(); },
      setTimedExamLock(locked) {
        this.timedExamActive = locked;
        const fab = document.getElementById('fabCheat');
        if (locked) { CheatSheet.toggle(false); fab.disabled = true; fab.innerHTML = '<span>🔒</span><span>مرجع قفل شد</span>'; }
        else { fab.disabled = false; fab.innerHTML = '<span>📑</span><span>مرجع سریع NMR</span>'; }
      },
      exportJSON() {
        const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = `nmr-progress-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(url);
        UI.toast('فایل پشتیبان JSON دانلود شد');
      },
      importJSON(file) {
        const r = new FileReader();
        r.onload = (e) => {
          try {
            const p = JSON.parse(e.target.result);
            if (typeof p !== 'object' || !p) throw new Error();
            this.data = Object.assign({}, this.data, p); this.applyPreferences(); this.save(); Router.renderCurrent();
            UI.toast('پیشرفت با موفقیت بازیابی شد');
          } catch { UI.toast('خطا: فایل JSON معتبر نیست'); }
        };
        r.readAsText(file);
      },
      resetAll() {
        if (!confirm('آیا از پاک کردن تمام پیشرفت‌های ذخیره‌شده مطمئن هستید؟')) return;
        this.data.completedSections = {}; this.data.completedSessions = {}; this.data.flashcards = {}; this.data.quizHistory = [];
        this.save(); Router.renderCurrent(); UI.toast('تمام داده‌های پیشرفت بازنشانی شدند');
      }
    };

    /* =========================================================
       3. FLOATING CHEAT SHEET ENGINE
       ========================================================= */
    const CheatSheet = {
      currentTab: 'h1',
      toggle(open) {
        if (open && AppState.timedExamActive) { UI.toast('در حالت آزمون زمان‌دار دسترسی به مرجع سریع غیرفعال است'); return; }
        document.getElementById('cheatDrawer').classList.toggle('open', open);
        document.getElementById('cheatBackdrop').classList.toggle('open', open);
        if (open) this.render();
      },
      switchTab(tab, btn) {
        this.currentTab = tab;
        document.querySelectorAll('#cheatTabs .tab-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        this.render();
      },
      render() {
        const el = document.getElementById('cheatContent');
        if (this.currentTab === 'h1') {
          el.innerHTML = `<h4>جدول شیفت شیمیایی پروتون (<bdi>¹H NMR</bdi>)</h4><div class="table-wrap"><table><thead><tr><th>نوع پروتون</th><th>بازه (<bdi>ppm</bdi>)</th></tr></thead><tbody>
            <tr><td>استاندارد داخلی (<bdi>TMS</bdi>)</td><td><bdi>0.0</bdi></td></tr>
            <tr><td>آلکان (<bdi>R-CH₃ / R-CH₂-R / R₃CH</bdi>)</td><td><bdi>0.7 – 1.7</bdi></td></tr>
            <tr><td>آلیلی / مجاور کربونیل (<bdi>C=C-CH / O=C-CH</bdi>)</td><td><bdi>1.6 – 2.6</bdi></td></tr>
            <tr><td>بنزیلی (<bdi>Ar-CH</bdi>)</td><td><bdi>2.3 – 2.7</bdi></td></tr>
            <tr><td>آلکین انتهایی (<bdi>R-C≡C-H</bdi>)</td><td><bdi>1.7 – 2.7</bdi></td></tr>
            <tr><td>متصل به هالوژن/اکسیژن (<bdi>O-CH, X-CH</bdi>)</td><td><bdi>3.2 – 4.8</bdi></td></tr>
            <tr><td>آلکن / وینیلی (<bdi>C=C-H</bdi>)</td><td><bdi>4.5 – 6.5</bdi></td></tr>
            <tr><td>آروماتیک (<bdi>Ar-H</bdi>)</td><td><bdi>6.5 – 8.0</bdi></td></tr>
            <tr><td>آلدهید (<bdi>R-CHO</bdi>)</td><td><bdi>9.0 – 10.0</bdi></td></tr>
            <tr><td>اسید کربوکسیلیک (<bdi>R-COOH</bdi>)</td><td><bdi>11.0 – 12.5</bdi></td></tr>
            <tr><td>تبادل‌پذیر (<bdi>OH, NH, SH</bdi>)</td><td><bdi>0.5 – 5.0 (var)</bdi></td></tr>
          </tbody></table></div>`;
        } else if (this.currentTab === 'c13') {
          el.innerHTML = `<h4>شیفت شیمیایی کربن (<bdi>¹³C NMR</bdi>)</h4><div class="table-wrap"><table><thead><tr><th>نوع کربن</th><th>بازه (<bdi>ppm</bdi>)</th></tr></thead><tbody>
            <tr><td>آلکان (<bdi>sp³ C-C</bdi>)</td><td><bdi>0 – 50</bdi></td></tr>
            <tr><td>متصل به هترواتم (<bdi>C-O, C-N, C-X</bdi>)</td><td><bdi>40 – 80</bdi></td></tr>
            <tr><td>آلکین (<bdi>C≡C</bdi>)</td><td><bdi>65 – 90</bdi></td></tr>
            <tr><td>آلکن و آروماتیک (<bdi>C=C, Ar</bdi>)</td><td><bdi>100 – 160</bdi></td></tr>
            <tr><td>کربونیل استر / اسید / آمید</td><td><bdi>160 – 185</bdi></td></tr>
            <tr><td>کربونیل آلدهید / کتون</td><td><bdi>190 – 220</bdi></td></tr>
          </tbody></table></div>
          <h4 style="margin-top:1rem;">جدول طلایی <bdi>DEPT</bdi></h4><div class="table-wrap"><table><thead><tr><th>گروه</th><th><bdi>Normal</bdi></th><th><bdi>DEPT-90</bdi></th><th><bdi>DEPT-135</bdi></th></tr></thead><tbody>
            <tr><td><bdi>CH₃</bdi></td><td>مثبت (+)</td><td>خاموش</td><td>رو به بالا (+)</td></tr>
            <tr><td><bdi>CH₂</bdi></td><td>مثبت (+)</td><td>خاموش</td><td>رو به پایین (−)</td></tr>
            <tr><td><bdi>CH</bdi></td><td>مثبت (+)</td><td>رو به بالا (+)</td><td>رو به بالا (+)</td></tr>
            <tr><td><bdi>Cq</bdi></td><td>مثبت (+)</td><td>خاموش</td><td>خاموش</td></tr>
          </tbody></table></div>`;
        } else if (this.currentTab === 'solvents') {
          el.innerHTML = `<h4>پیک حلال‌های دوتره رایج</h4><div class="table-wrap"><table><thead><tr><th>حلال</th><th><bdi>¹H (ppm)</bdi></th><th><bdi>¹³C (ppm)</bdi></th></tr></thead><tbody>
            <tr><td><strong><bdi>CDCl₃</bdi></strong></td><td><bdi>7.26 (s)</bdi><br/><small>آب: <bdi>1.56</bdi></small></td><td><bdi>77.16 (t, 1:1:1)</bdi></td></tr>
            <tr><td><strong><bdi>DMSO-d₆</bdi></strong></td><td><bdi>2.50 (quin)</bdi><br/><small>آب: <bdi>3.33</bdi></small></td><td><bdi>39.52 (sep, 7)</bdi></td></tr>
            <tr><td><strong><bdi>D₂O</bdi></strong></td><td><bdi>4.80 (s)</bdi></td><td>—</td></tr>
            <tr><td><strong><bdi>CD₃OD</bdi></strong></td><td><bdi>3.31 (quin), 4.87 (s)</bdi></td><td><bdi>49.00 (sep)</bdi></td></tr>
          </tbody></table></div>`;
        } else {
          el.innerHTML = `<h4>فرمول‌های حیاتی امتحان</h4>
            <p><strong>۱. درجه غیراشباعی (<bdi>DU</bdi>):</strong></p><div class="formula-box">DU = (2C + 2 + N − H − X) / 2</div>
            <p><strong>۲. فرکانس لارمور:</strong></p><div class="formula-box">ν = (γ · B₀) / (2π) &nbsp;|&nbsp; ΔE = hν</div>
            <p><strong>۳. شیفت شیمیایی (<bdi>ppm</bdi>):</strong></p><div class="formula-box">δ (ppm) = (ν_sample − ν_TMS) [Hz] / ν₀ [MHz]</div>
            <p><strong>۴. ثابت کوپلاژ (<bdi>J</bdi>):</strong></p><div class="formula-box">J (Hz) = Δδ (ppm) × ν₀ (MHz)</div>
            <p><strong>۵. معیار مرتبه اول:</strong></p><div class="formula-box">Δν / J &gt; 6</div>`;
        }
      }
    };

    /* =========================================================
       4. INTERACTIVE SVG SPECTRUM ENGINE
       ========================================================= */
    const NMRSpectrumEngine = {
      pascal(n) { const r = [1]; for (let i = 0; i < n; i++) r.push(r[i] * (n - i) / (i + 1)); return r; },
      getSubPeaks(peak, freqMHz) {
        const mult = (peak.multiplicity || 's').toLowerCase();
        const jPpm = (peak.jHz || 7) / freqMHz, j2Ppm = (peak.j2Hz || 2.5) / freqMHz, h = peak.height || 0.85;
        const mapN = { s: 0, d: 1, t: 2, q: 3, quin: 4, p: 4, sex: 5, sep: 6 };
        if (mult === 'dd') return [
          { ppm: peak.ppm - (jPpm + j2Ppm) / 2, relH: h * 0.85 }, { ppm: peak.ppm - (jPpm - j2Ppm) / 2, relH: h * 0.85 },
          { ppm: peak.ppm + (jPpm - j2Ppm) / 2, relH: h * 0.85 }, { ppm: peak.ppm + (jPpm + j2Ppm) / 2, relH: h * 0.85 }
        ];
        if (mult === 'broad' || mult === 'br') return [{ ppm: peak.ppm, relH: h * 0.55, broad: true }];
        const n = mapN[mult] !== undefined ? mapN[mult] : 0, weights = this.pascal(n), maxW = Math.max(...weights);
        return weights.map((w, idx) => ({ ppm: peak.ppm + (idx - n / 2) * jPpm, relH: h * (w / maxW) }));
      },
      render(container, config) {
        const type = config.type || '1H', minPpm = config.minPpm !== undefined ? config.minPpm : 0;
        const maxPpm = config.maxPpm !== undefined ? config.maxPpm : (type === '13C' ? 220 : 13);
        const freqMHz = config.freqMHz || (type === '13C' ? 75 : 300), peaks = config.peaks || [];
        const uid = 'nmr_' + Math.random().toString(36).slice(2, 8);
        const W = 760, H = 260, padL = 28, padR = 28, padT = 24, padB = 42, plotW = W - padL - padR, baseY = H - padB, maxPeakH = baseY - padT - 18;
        const ppmToX = (ppm) => padL + ((maxPpm - ppm) / (maxPpm - minPpm)) * plotW;

        const step = type === '13C' ? 20 : 1;
        let ticksSvg = '';
        for (let p = minPpm; p <= maxPpm; p += step) {
          const x = ppmToX(p);
          ticksSvg += `<line x1="${x}" y1="${baseY}" x2="${x}" y2="${baseY + 6}" stroke="var(--text-muted)"/><text x="${x}" y="${baseY + 20}" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="var(--text-muted)">${p}</text>`;
        }
        let tmsSvg = '';
        if (config.showTMS !== false && minPpm <= 0) {
          const tx = ppmToX(0);
          tmsSvg = `<g class="nmr-peak-group" data-peak-id="tms" opacity="0.65"><path d="M ${tx - 4} ${baseY} Q ${tx} ${baseY - 40} ${tx} ${baseY - 52} Q ${tx} ${baseY - 40} ${tx + 4} ${baseY}" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/><text x="${tx}" y="${baseY - 58}" text-anchor="middle" font-size="10" font-family="var(--font-mono)" fill="var(--text-muted)">TMS</text></g>`;
        }
        const palette = ['#2563eb', '#dc2626', '#059669', '#d97706', '#7c3aed', '#0891b2'];
        let peaksSvg = '';
        peaks.forEach((pk, idx) => {
          const color = pk.color || palette[idx % palette.length];
          const subPeaks = this.getSubPeaks(pk, freqMHz);
          let d = '';
          subPeaks.forEach(sp => {
            const cx = ppmToX(sp.ppm), ph = sp.relH * maxPeakH, halfW = sp.broad ? 14 : (type === '13C' ? 2.2 : 3.6);
            d += `M ${cx - halfW} ${baseY} C ${cx - halfW * 0.35} ${baseY}, ${cx - halfW * 0.15} ${baseY - ph}, ${cx} ${baseY - ph} C ${cx + halfW * 0.15} ${baseY - ph}, ${cx + halfW * 0.35} ${baseY}, ${cx + halfW} ${baseY} `;
          });
          const labelX = ppmToX(pk.ppm), topY = baseY - (pk.height || 0.85) * maxPeakH - 10;
          peaksSvg += `<g class="nmr-peak-group" data-peak-id="${pk.id || idx}" data-group-id="${pk.groupId || pk.id || idx}" style="color:${color};"><path class="peak-path" d="${d}" fill="none" stroke="${color}" stroke-width="1.9" stroke-linejoin="round"/><text x="${labelX}" y="${Math.max(14, topY)}" text-anchor="middle" font-size="11" font-weight="700" font-family="var(--font-mono)" fill="${color}">${pk.label || ''}</text></g>`;
        });

        let integralSvg = '';
        if (type === '1H' && peaks.some(p => p.integral)) {
          const sorted = [...peaks].filter(p => p.integral).sort((a, b) => a.ppm - b.ppm);
          const totalInt = sorted.reduce((s, p) => s + p.integral, 0) || 1;
          let curY = baseY - 14, pathD = `M ${ppmToX(minPpm)} ${curY} `, labelsInt = '';
          sorted.forEach(p => {
            const px = ppmToX(p.ppm), stepH = (p.integral / totalInt) * (maxPeakH * 0.72);
            pathD += `L ${px + 8} ${curY} C ${px + 2} ${curY}, ${px - 2} ${curY - stepH}, ${px - 8} ${curY - stepH} `;
            labelsInt += `<text x="${px}" y="${curY - stepH - 5}" text-anchor="middle" font-size="10" font-weight="700" font-family="var(--font-mono)" fill="var(--success)">${p.integral}H</text>`;
            curY -= stepH;
          });
          pathD += `L ${ppmToX(maxPpm)} ${curY}`;
          integralSvg = `<g class="nmr-integral-layer" style="display:none;"><path d="${pathD}" fill="none" stroke="var(--success)" stroke-width="1.7" stroke-dasharray="5 3" opacity="0.9"/>${labelsInt}</g>`;
        }

        const pillsHtml = peaks.map((pk, idx) => {
          const color = pk.color || palette[idx % palette.length], gid = pk.groupId || pk.id || idx;
          return `<button type="button" class="mol-group-pill" data-group-id="${gid}" style="border-right:4px solid ${color};"><bdi>${pk.label || 'Peak ' + (idx + 1)}</bdi><small style="color:var(--text-muted);"><bdi>${pk.ppm} ppm</bdi></small></button>`;
        }).join('');

        container.innerHTML = `<div class="nmr-widget" id="${uid}">
          <div class="nmr-toolbar">
            <div><strong>${config.title || 'طیف NMR'}</strong><span class="badge badge-info" style="margin-right:0.4rem;"><bdi>${freqMHz} MHz</bdi></span></div>
            <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
              ${integralSvg ? `<button type="button" class="btn btn-sm" data-action="toggle-integral">📈 نمایش پله انتگرال</button>` : ''}
              <button type="button" class="btn btn-sm" data-action="reset-highlight">↺ نمایش همه پیک‌ها</button>
            </div>
          </div>
          ${config.moleculeSvg ? `<div class="nmr-molecule-box" style="margin-bottom:0.75rem; text-align:center;">${config.moleculeSvg}</div>` : ''}
          <div style="display:flex; flex-wrap:wrap; gap:0.45rem; margin-bottom:0.75rem;">${pillsHtml}</div>
          <div class="nmr-svg-wrap"><svg class="nmr-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${config.title || 'طیف NMR'}">
            <line x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}" stroke="var(--text-secondary)" stroke-width="1.5"/>
            ${ticksSvg}<text x="${W / 2}" y="${H - 4}" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="var(--text-muted)">Chemical Shift δ (ppm)</text>
            ${tmsSvg}${peaksSvg}${integralSvg}
          </svg></div>
          <div class="nmr-info-bar" data-role="info"><span>روی هر پیک در طیف یا گروه در مولکول کلیک کنید تا جزئیات آن هایلایت شود.</span></div>
        </div>`;

        const root = document.getElementById(uid), infoBar = root.querySelector('[data-role="info"]'), peakEls = root.querySelectorAll('.nmr-peak-group');
        const highlightGroup = (gid) => {
          peakEls.forEach(el => { const m = el.dataset.groupId === String(gid); el.classList.toggle('highlighted', m); el.classList.toggle('dimmed', !m); });
          root.querySelectorAll('.mol-group-pill').forEach(p => p.classList.toggle('active', p.dataset.groupId === String(gid)));
          const pk = peaks.find((p, i) => String(p.groupId || p.id || i) === String(gid));
          if (pk) infoBar.innerHTML = `<div><strong><bdi>${pk.label}</bdi></strong> — شیفت: <bdi><strong>${pk.ppm} ppm</strong></bdi> | چندگانگی: <bdi><strong>${pk.multiplicity || 's'}</strong></bdi>${pk.jHz ? ` | <bdi>J = ${pk.jHz} Hz</bdi>` : ''}${pk.integral ? ` | انتگرال: <bdi><strong>${pk.integral}H</strong></bdi>` : ''}</div><div style="color:var(--text-secondary);">${pk.note || ''}</div>`;
        };
        const resetHighlight = () => {
          peakEls.forEach(el => el.classList.remove('highlighted', 'dimmed'));
          root.querySelectorAll('.mol-group-pill').forEach(p => p.classList.remove('active'));
          infoBar.innerHTML = '<span>روی هر پیک در طیف یا گروه در مولکول کلیک کنید تا جزئیات آن هایلایت شود.</span>';
        };
        root.querySelectorAll('[data-group-id]').forEach(el => el.addEventListener('click', () => highlightGroup(el.dataset.groupId)));
        const rBtn = root.querySelector('[data-action="reset-highlight"]'); if (rBtn) rBtn.addEventListener('click', resetHighlight);
        const iBtn = root.querySelector('[data-action="toggle-integral"]');
        if (iBtn) iBtn.addEventListener('click', () => {
          const layer = root.querySelector('.nmr-integral-layer'), hid = layer.style.display === 'none';
          layer.style.display = hid ? 'block' : 'none'; iBtn.classList.toggle('btn-success', hid);
        });
      }
    };

    /* =========================================================
       5. UNIFIED FLASHCARD & QUIZ ENGINES
       ========================================================= */
    const FlashcardEngine = {
      render(container, cards, title = 'مرور هوشمند فلش‌کارت‌ها') {
        if (!cards || !cards.length) { container.innerHTML = `<div class="card"><p style="margin:0;">فلش‌کارتی موجود نیست.</p></div>`; return; }
        let idx = 0, filter = 'all';
        const getFiltered = () => filter === 'all' ? cards : cards.filter(c => (AppState.data.flashcards[c.id] || 'new') === filter);
        const draw = () => {
          const list = getFiltered();
          if (!list.length) {
            container.innerHTML = `<div class="card"><div class="card-header"><h3 style="margin:0;">🎴 ${title}</h3><button class="btn btn-sm" id="fcResetFilter">نمایش همه (${cards.length})</button></div><p>کارتی در این فیلتر نیست.</p></div>`;
            container.querySelector('#fcResetFilter').onclick = () => { filter = 'all'; idx = 0; draw(); };
            return;
          }
          if (idx >= list.length) idx = 0;
          const card = list[idx], st = AppState.data.flashcards[card.id] || 'new';
          const stLbl = { new: 'جدید', hard: 'سخت', medium: 'متوسط', mastered: 'مسلط' }[st];
          container.innerHTML = `<div class="card">
            <div class="card-header"><h3 style="margin:0;">🎴 ${title}</h3>
              <div style="display:flex; gap:0.35rem; flex-wrap:wrap;">
                <button class="btn btn-sm ${filter==='all'?'btn-primary':''}" data-f="all">همه (${cards.length})</button>
                <button class="btn btn-sm ${filter==='hard'?'btn-danger':''}" data-f="hard">سخت</button>
                <button class="btn btn-sm ${filter==='medium'?'btn-warning':''}" data-f="medium">متوسط</button>
                <button class="btn btn-sm ${filter==='mastered'?'btn-success':''}" data-f="mastered">مسلط</button>
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.84rem; color:var(--text-muted);"><span>کارت <bdi>${idx + 1} / ${list.length}</bdi></span><span class="badge badge-info">وضعیت: ${stLbl}</span></div>
            <div class="flashcard-stage"><div class="flashcard-inner" id="fcInner">
              <div class="flashcard-face"><span class="badge badge-core" style="margin-bottom:0.75rem;">پرسش (کلیک کنید)</span><div style="font-size:1.05rem; font-weight:700;">${card.front}</div></div>
              <div class="flashcard-face flashcard-back"><span class="badge badge-success" style="margin-bottom:0.75rem;">پاسخ کلیدی</span><div style="font-size:0.98rem;">${card.back}</div></div>
            </div></div>
            <div class="fc-controls">
              <button class="btn btn-sm" id="fcPrev">→ قبلی</button>
              <button class="btn btn-sm btn-danger" data-rate="hard">🔴 سخت</button>
              <button class="btn btn-sm btn-warning" data-rate="medium">🟡 متوسط</button>
              <button class="btn btn-sm btn-success" data-rate="mastered">🟢 مسلط شدم</button>
              <button class="btn btn-sm" id="fcNext">بعدی ←</button>
            </div>
          </div>`;
          const inner = container.querySelector('#fcInner'); inner.onclick = () => inner.classList.toggle('flipped');
          container.querySelector('#fcPrev').onclick = () => { idx = (idx - 1 + list.length) % list.length; draw(); };
          container.querySelector('#fcNext').onclick = () => { idx = (idx + 1) % list.length; draw(); };
          container.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; idx = 0; draw(); });
          container.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { AppState.setFlashcardMastery(card.id, b.dataset.rate); idx = (idx + 1) % list.length; draw(); });
        };
        draw();
      }
    };

    const QuizEngine = {
      timerInterval: null,
      stopTimer() { if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; } AppState.setTimedExamLock(false); },
      start(container, { title, questions, timed = false, durationSec = 600 }) {
        this.stopTimer();
        if (!questions || !questions.length) { container.innerHTML = `<div class="card"><p style="margin:0;">سؤالی موجود نیست.</p></div>`; return; }
        let current = 0, answers = {}, submitted = false, remaining = durationSec;
        if (timed) {
          AppState.setTimedExamLock(true);
          this.timerInterval = setInterval(() => {
            remaining--; const t = container.querySelector('#quizTimerDisplay');
            if (t) t.textContent = this.formatTime(remaining);
            if (remaining <= 0) submitExam();
          }, 1000);
        }
        const submitExam = () => {
          if (submitted) return; submitted = true; this.stopTimer();
          const score = questions.reduce((acc, q, i) => acc + (answers[i] === q.answerIndex ? 1 : 0), 0);
          AppState.recordQuiz({ id: 'q_' + Date.now(), title, score, total: questions.length, timed });
          renderView();
        };
        const renderView = () => {
          if (submitted) {
            const score = questions.reduce((acc, q, i) => acc + (answers[i] === q.answerIndex ? 1 : 0), 0);
            const pct = Math.round((score / questions.length) * 100);
            container.innerHTML = `<div class="card">
              <div class="card-header"><h3 style="margin:0;">📊 نتیجه: ${title}</h3><span class="badge ${pct >= 70 ? 'badge-success' : 'badge-danger'}"><bdi>${score} / ${questions.length} (${pct}%)</bdi></span></div>
              <div style="margin-bottom:1rem;"><button class="btn btn-primary btn-sm" id="retryQuizBtn">↻ آزمون مجدد</button></div>
              ${questions.map((q, i) => `<div class="callout ${answers[i] === q.answerIndex ? 'success' : 'warning'}"><div style="font-weight:700; margin-bottom:0.4rem;">سؤال ${i + 1}: ${q.question}</div><div style="font-size:0.86rem;">پاسخ شما: <strong>${answers[i] !== undefined ? q.options[answers[i]] : 'بی‌پاسخ'}</strong> | صحیح: <strong>${q.options[q.answerIndex]}</strong></div>${q.explanation ? `<div style="margin-top:0.4rem; font-size:0.86rem;">💡 ${q.explanation}</div>` : ''}</div>`).join('')}
            </div>`;
            container.querySelector('#retryQuizBtn').onclick = () => this.start(container, { title, questions, timed, durationSec });
            return;
          }
          const q = questions[current];
          container.innerHTML = `<div class="card">
            <div class="card-header"><div><h3 style="margin:0;">📝 ${title}</h3><small style="color:var(--text-muted);">سؤال <bdi>${current + 1}</bdi> از <bdi>${questions.length}</bdi></small></div>${timed ? `<div class="quiz-timer" id="quizTimerDisplay">${this.formatTime(remaining)}</div>` : ''}</div>
            <div style="font-size:1rem; font-weight:700; margin-bottom:1rem;">${q.question}</div>
            ${q.spectrumConfig ? `<div id="quizSpectrumMount"></div>` : ''}
            <div>${q.options.map((opt, idx) => `<button type="button" class="quiz-option ${answers[current] === idx ? 'selected' : ''}" data-opt="${idx}"><span class="badge badge-info"><bdi>${idx + 1}</bdi></span><span>${opt}</span></button>`).join('')}</div>
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.6rem; margin-top:1rem;">
              <button class="btn btn-sm" id="qPrev" ${current === 0 ? 'disabled' : ''}>→ قبلی</button>
              <div>${current < questions.length - 1 ? `<button class="btn btn-primary btn-sm" id="qNext">بعدی ←</button>` : `<button class="btn btn-success btn-sm" id="qFinish">✔ ثبت نهایی</button>`}</div>
            </div>
          </div>`;
          if (q.spectrumConfig) NMRSpectrumEngine.render(container.querySelector('#quizSpectrumMount'), q.spectrumConfig);
          container.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { answers[current] = Number(b.dataset.opt); renderView(); });
          const prev = container.querySelector('#qPrev'); if (prev) prev.onclick = () => { current--; renderView(); };
          const next = container.querySelector('#qNext'); if (next) next.onclick = () => { current++; renderView(); };
          const fin = container.querySelector('#qFinish'); if (fin) fin.onclick = submitExam;
        };
        renderView();
      },
      formatTime(sec) { return `${String(Math.floor(Math.max(0, sec) / 60)).padStart(2, '0')}:${String(Math.max(0, sec) % 60).padStart(2, '0')}`; }
    };

    /* =========================================================
       6. GLOBAL SEARCH & ROUTER & UI
       ========================================================= */
    const SearchEngine = {
      open() { document.getElementById('searchModalBackdrop').classList.add('open'); const i = document.getElementById('globalSearchInput'); i.value = ''; i.focus(); this.run(''); },
      close() { document.getElementById('searchModalBackdrop').classList.remove('open'); },
      buildIndex() {
        const items = [];
        COURSE_DATA.sessions.forEach(s => {
          items.push({ type: 'جلسه', title: `جلسه ${s.number}: ${s.title}`, text: s.summary || '', route: `session-${s.number}` });
          (s.sections || []).forEach(sec => items.push({ type: `جلسه ${s.number}`, title: sec.title, text: (sec.html || '').replace(/<[^>]+>/g, ' '), route: `session-${s.number}` }));
          (s.flashcards || []).forEach(fc => items.push({ type: `فلش‌کارت جلسه ${s.number}`, title: fc.front, text: fc.back, route: `session-${s.number}` }));
        });
        COURSE_DATA.simulators.forEach(sim => items.push({ type: 'شبیه‌ساز', title: sim.title, text: sim.description || '', route: 'lab' }));
        (COURSE_DATA.examBank.historical || []).forEach(q => items.push({ type: 'سؤال تاریخی', title: `${q.code}: ${q.question}`, text: q.explanation || '', route: 'exams' }));
        (COURSE_DATA.examBank.examples || []).forEach(ex => items.push({ type: 'مثال استاد', title: `${ex.code}: ${ex.title}`, text: ex.summary || '', route: `session-${ex.session}` }));
        return items;
      },
      run(query) {
        const resEl = document.getElementById('globalSearchResults'), q = (query || '').trim().toLowerCase(), idx = this.buildIndex();
        const hits = q ? idx.filter(it => (it.title + ' ' + it.text).toLowerCase().includes(q)).slice(0, 20) : idx.slice(0, 12);
        resEl.innerHTML = hits.length
          ? hits.map(h => `<button class="search-hit" onclick="SearchEngine.close(); Router.go('${h.route}')"><span class="search-hit-meta">${h.type}</span><strong>${h.title}</strong></button>`).join('')
          : `<p style="padding:1rem; text-align:center;">نتیجه‌ای برای «${query}» پیدا نشد.</p>`;
      }
    };

    const Router = {
      currentRoute: 'home',
      go(route) { QuizEngine.stopTimer(); this.currentRoute = route; UI.toggleSidebar(false); this.renderSidebar(); this.renderCurrent(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
      renderSidebar() {
        const nav = document.getElementById('sidebarNav');
        let html = `<div class="nav-group-label">مسیر اصلی</div>
          <button class="nav-item ${this.currentRoute==='home'?'active':''}" onclick="Router.go('home')"><span class="nav-item-main"><span>🏠</span><span class="nav-item-title">صفحه خانه و نقشه دوره</span></span></button>
          <div class="nav-group-label">جلسات درسنامه (۱ تا ۷)</div>`;
        for (let i = 1; i <= 7; i++) {
          const s = COURSE_DATA.sessions.find(x => x.number === i), done = !!AppState.data.completedSessions[i];
          html += `<button class="nav-item ${this.currentRoute===`session-${i}`?'active':''} ${done?'done':''}" onclick="Router.go('session-${i}')"><span class="nav-item-main"><span>📘</span><span class="nav-item-title">جلسه ${i}: ${s ? s.shortTitle : ''}</span></span><span class="nav-badge">${done ? '✔' : i}</span></button>`;
        }
        html += `<div class="nav-group-label">ابزارهای تعاملی و ارزیابی</div>
          <button class="nav-item ${this.currentRoute==='lab'?'active':''}" onclick="Router.go('lab')"><span class="nav-item-main"><span>🧪</span><span class="nav-item-title">آزمایشگاه شبیه‌سازها</span></span><span class="nav-badge">${COURSE_DATA.simulators.length}</span></button>
          <button class="nav-item ${this.currentRoute==='exams'?'active':''}" onclick="Router.go('exams')"><span class="nav-item-main"><span>🎯</span><span class="nav-item-title">بانک جامع آزمون</span></span></button>
          <button class="nav-item ${this.currentRoute==='dashboard'?'active':''}" onclick="Router.go('dashboard')"><span class="nav-item-main"><span>📊</span><span class="nav-item-title">داشبورد پیشرفت</span></span></button>`;
        nav.innerHTML = html;
      },
      renderCurrent() {
        const v = document.getElementById('appView');
        if (this.currentRoute === 'home') return this.renderHome(v);
        if (this.currentRoute === 'lab') return this.renderLab(v);
        if (this.currentRoute === 'exams') return this.renderExams(v);
        if (this.currentRoute === 'dashboard') return this.renderDashboard(v);
        if (this.currentRoute.startsWith('session-')) return this.renderSession(v, Number(this.currentRoute.split('-')[1]));
      },
      renderHome(view) {
        view.innerHTML = `<div class="card"><span class="badge badge-info" style="margin-bottom:0.6rem;">نسخه یکپارچه آفلاین (SPA)</span><h1>${COURSE_DATA.meta.title}</h1><p>${COURSE_DATA.meta.subtitle}</p>
          <div style="display:flex; flex-wrap:wrap; gap:0.6rem; margin-top:1rem;">
            <button class="btn btn-primary" onclick="Router.go('session-1')">شروع مطالعه از جلسه ۱ ←</button>
            <button class="btn" onclick="Router.go('lab')">🧪 آزمایشگاه (${COURSE_DATA.simulators.length} شبیه‌ساز)</button>
            <button class="btn" onclick="Router.go('exams')">🎯 بانک جامع آزمون</button>
          </div></div>
          <h2>نقشه مسیر ۷ جلسه</h2><div class="grid-auto">
          ${COURSE_DATA.sessions.map(s => {
            const done = !!AppState.data.completedSessions[s.number];
            return `<div class="card" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:space-between;"><div>
              <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;"><span class="badge ${done?'badge-success':'badge-info'}">جلسه ${s.number}</span>${done?'<span class="badge badge-success">✔ مطالعه‌شده</span>':''}</div>
              <h3>${s.title}</h3><p style="font-size:0.85rem;">${s.summary}</p></div>
              <button class="btn btn-sm" onclick="Router.go('session-${s.number}')">ورود به جلسه ←</button></div>`;
          }).join('')}</div>`;
      },
      renderSession(view, num) {
        const s = COURSE_DATA.sessions.find(x => x.number === num); if (!s) return;
        const isDone = !!AppState.data.completedSessions[num];
        view.innerHTML = `<div class="card"><div class="card-header"><div><span class="badge badge-info">جلسه ${s.number}</span><h1 style="margin-top:0.35rem;">${s.title}</h1></div>
          <button class="btn ${isDone?'btn-success':'btn-primary'} btn-sm" onclick="AppState.toggleSessionDone(${num}); Router.renderCurrent();">${isDone ? '✔ تکمیل شده' : 'ثبت به‌عنوان مطالعه‌شده'}</button></div><p>${s.summary}</p></div>
          <div class="tabs-bar" id="sessionTabs">
            <button class="tab-btn active" data-tab="lesson">📖 درسنامه</button>
            <button class="tab-btn" data-tab="flashcards">🎴 فلش‌کارت‌ها (${(s.flashcards||[]).length})</button>
            <button class="tab-btn" data-tab="quiz">📝 آزمونک جلسه (${(s.quiz||[]).length})</button>
          </div><div id="sessionTabBody"></div>`;
        const body = document.getElementById('sessionTabBody');
        const renderTab = (tab) => {
          document.querySelectorAll('#sessionTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
          if (tab === 'lesson') {
            body.innerHTML = (s.sections || []).map((sec, i) => `<section class="card"><div class="card-header"><h2 style="margin:0;">${sec.title}</h2>${sec.tag?`<span class="badge ${sec.tag==='Exam Core'?'badge-core':'badge-deep'}">${sec.tag}</span>`:''}</div><div class="lesson-html">${sec.html || ''}</div>${sec.spectrumConfig?`<div class="session-spectrum-mount" data-spec-idx="${i}"></div>`:''}</section>`).join('');
            body.querySelectorAll('.session-spectrum-mount').forEach(el => NMRSpectrumEngine.render(el, s.sections[Number(el.dataset.specIdx)].spectrumConfig));
            UI.bindDeepLearningAccordions(body);
          } else if (tab === 'flashcards') FlashcardEngine.render(body, s.flashcards || [], `فلش‌کارت‌های جلسه ${num}`);
          else QuizEngine.start(body, { title: `آزمونک جلسه ${num}`, questions: s.quiz || [], timed: false });
        };
        document.querySelectorAll('#sessionTabs .tab-btn').forEach(b => b.onclick = () => renderTab(b.dataset.tab));
        renderTab('lesson');
      },
      renderLab(view) {
        view.innerHTML = `<div class="card"><h1>🧪 آزمایشگاه شبیه‌سازهای تعاملی NMR (${COURSE_DATA.simulators.length} ابزار)</h1><p>تمام شبیه‌سازهای محاسباتی، طیف‌نمایی و حل ساختار دوره به‌صورت آفلاین در این بخش یکپارچه شده‌اند.</p></div><div id="labSimulatorsMount" class="grid-2"></div>`;
        const simMount = document.getElementById('labSimulatorsMount');
        simMount.innerHTML = COURSE_DATA.simulators.map(sim => `<div class="card" style="margin-bottom:0;"><h3>${sim.title}</h3><p style="font-size:0.84rem;">${sim.description || ''}</p><div id="sim_mount_${sim.id}"></div></div>`).join('');
        COURSE_DATA.simulators.forEach(sim => { const t = document.getElementById(`sim_mount_${sim.id}`); if (t && typeof sim.mount === 'function') sim.mount(t); });
      },
      renderExams(view) {},
      renderDashboard(view) {
        const done = Object.keys(AppState.data.completedSessions).length;
        const mastered = Object.values(AppState.data.flashcards).filter(v => v === 'mastered').length;
        const avg = AppState.data.quizHistory.length ? Math.round(AppState.data.quizHistory.reduce((s, q) => s + (q.score / q.total) * 100, 0) / AppState.data.quizHistory.length) : 0;
        view.innerHTML = `<div class="card"><div class="card-header"><h1 style="margin:0;">📊 داشبورد پیشرفت یکپارچه</h1>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-sm btn-primary" onclick="AppState.exportJSON()">⬇ خروجی JSON</button>
            <label class="btn btn-sm" style="margin:0;">⬆ ورودی JSON<input type="file" accept=".json" style="display:none;" onchange="if(this.files[0]) AppState.importJSON(this.files[0])"/></label>
            <button class="btn btn-sm btn-danger" onclick="AppState.resetAll()">🗑 بازنشانی</button>
          </div></div>
          <div class="grid-3">
            <div class="callout"><div style="font-size:0.84rem;">جلسات تکمیل‌شده</div><div style="font-size:1.6rem; font-weight:800;"><bdi>${done} / 7</bdi></div></div>
            <div class="callout success"><div style="font-size:0.84rem;">فلش‌کارت‌های مسلط</div><div style="font-size:1.6rem; font-weight:800;"><bdi>${mastered}</bdi></div></div>
            <div class="callout exam-core"><div style="font-size:0.84rem;">میانگین نمرات آزمون</div><div style="font-size:1.6rem; font-weight:800;"><bdi>${avg}%</bdi></div></div>
          </div></div>
          <div class="card"><h3>تاریخچه آزمون‌های اخیر</h3>${AppState.data.quizHistory.length ? `<div class="table-wrap"><table><thead><tr><th>عنوان آزمون</th><th>نوع</th><th>نمره</th><th>تاریخ</th></tr></thead><tbody>${AppState.data.quizHistory.map(q => `<tr><td>${q.title}</td><td>${q.timed?'⏱ زمان‌دار':'عادی'}</td><td><bdi><strong>${q.score}/${q.total}</strong></bdi></td><td>${q.date}</td></tr>`).join('')}</tbody></table></div>` : `<p style="margin:0;">هنوز آزمونی ثبت نشده است.</p>`}</div>`;
      }
    };

    const UI = {
      toggleSidebar(open) { document.getElementById('sidebar').classList.toggle('open', open); document.getElementById('sidebarBackdrop').classList.toggle('open', open); },
      toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(this._t); this._t = setTimeout(() => el.classList.remove('show'), 2500); },
      updateGlobalProgress() {
        const pct = Math.round((Object.keys(AppState.data.completedSessions).length / 7) * 100);
        document.getElementById('sidebarProgressPct').textContent = pct + '%';
        document.getElementById('sidebarProgressFill').style.width = pct + '%';
      },
      bindDeepLearningAccordions(root) {
        root.querySelectorAll('.deep-learning').forEach(box => {
          if (box.dataset.bound) return; box.dataset.bound = '1';
          let h = box.querySelector('.deep-learning-header');
          if (!h) {
            const title = box.dataset.title || 'تحلیل عمیق (پاویا)';
            box.innerHTML = `<button type="button" class="deep-learning-header"><span>🔬 ${title}</span><span class="chevron">▾</span></button><div class="deep-learning-body">${box.innerHTML}</div>`;
            h = box.querySelector('.deep-learning-header');
          }
          h.addEventListener('click', () => { if (document.body.classList.contains('exam-mode')) box.classList.toggle('dl-open'); else box.classList.toggle('dl-closed'); });
        });
      }

        { code:'A-15', cat:'cat-3', session:2, question:'کدام پروتون در ۱۱ تا ۱۲ ppm پیک پهن می‌دهد؟', options:['کربوکسیلیک اسید (–COOH)','متیل استر','آلکن سیس','آمین'], answerIndex:0, explanation:'پیوند هیدروژنی قوی و کشندگی کربونیل.' },
        { code:'A-16', cat:'cat-4', session:3, question:'دی‌اتیل اتر چند سیگنال و با چه شکافتی می‌دهد؟', options:['۲ سیگنال: کوارتت (4H) و تریپلت (6H)','۴ سیگنال','۱ سینگلت','۲ دابلت'], answerIndex:0, explanation:'تقارن اتر دو اتیل را معادل می‌کند.' },
        { code:'A-17', cat:'cat-4', session:3, question:'چرا پروتون‌های هم‌ارز مغناطیسی همدیگر را نمی‌شکنند؟', options:['کوپلاژ بین هم‌ارزهای مغناطیسی شکافت قابل‌مشاهده نمی‌دهد','فاصله زیاد','انتگرال صفر','فقط در 60 MHz'], answerIndex:0, explanation:'قانون بنیادی شکافت اسپین–اسپین.' },
        { code:'A-18', cat:'cat-4', session:3, question:'انتگرال‌های ۲۴، ۱۶ و ۸ میلی‌متر برای ترکیبی ۱۲ پروتونی معادل چند H است؟', options:['۶، ۴ و ۲ پروتون','۳، ۲ و ۱','۸، ۲ و ۲','۴، ۴ و ۴'], answerIndex:0, explanation:'نسبت ۳:۲:۱ ضربدر ۲ = ۶H، ۴H، ۲H.' },
        { code:'A-19', cat:'cat-4', session:4, question:'پروتون وسط در ۲-برموپروپان به چند شاخه می‌شکند؟', options:['۷ شاخه (سپتت)','۴ شاخه','۳ شاخه','۲ شاخه'], answerIndex:0, explanation:'۶ همسایه متیل ← ۶+۱ = ۷.' },
        { code:'A-20', cat:'cat-4', session:4, question:'در کدام حالت دو پروتون یک CH₂ دیاسترئوتوپیک می‌شوند؟', options:['مجاورت با مرکز کایرال','اتانول خالص','متیل استات','بنزن'], answerIndex:0, explanation:'مرکز کایرال تقارن را از بین می‌برد.' },
        { code:'A-21', cat:'cat-5', session:5, question:'چرا انتگرال در ¹³C{¹H} معتبر نیست؟', options:['تفاوت T₁ و تقویت نامتقارن NOE','اسپین صفر ¹³C','جذب CDCl₃','رسم منفی'], answerIndex:0, explanation:'کربن نوع چهارم T₁ طولانی و NOE ناچیز دارد.' },
        { code:'A-22', cat:'cat-5', session:5, question:'اثر Broadband Proton Decoupling در ¹³C چیست؟', options:['حذف شکافت‌های C–H و تبدیل به سینگلت تیز','دو برابر شدن شاخه‌ها','منفی شدن CH₂','حذف کربونیل'], answerIndex:0, explanation:'اشباع پروتون‌ها تمام چندشاخه‌ای‌ها را حذف می‌کند.' },
        { code:'A-23', cat:'cat-5', session:5, question:'تریپلت ۱:۱:۱ در ۷۷ ppm طیف ¹³C چیست؟', options:['حلال CDCl₃','کربونیل اسید','متوکسی','TMS'], answerIndex:0, explanation:'کوپلاژ ¹³C با یک دوتریوم (I=1).' },
        { code:'A-24', cat:'cat-5', session:5, question:'۲۱ (+ در 135، غایب 90)، ۷۱ (− در 135، غایب 90) و ۱۸ (غایب در هر دو) به ترتیب چیستند؟', options:['CH₃، CH₂ و Cq','CH، CH₃ و CH₂','CH₂، CH و CH₃','CH₃، CH و CH₂'], answerIndex:0, explanation:'مطابق جدول طلایی DEPT.' },
        { code:'A-25', cat:'cat-5', session:5, question:'پارا-زایلن در ¹³C{¹H} چند سیگنال می‌دهد؟', options:['۳ سیگنال','۶ سیگنال','۸ سیگنال','۲ سیگنال'], answerIndex:0, explanation:'متیل‌ها (۱)، کربن‌های ipso (۱) و ۴ کربن CH حلقه (۱).' },
        { code:'A-26', cat:'cat-6', session:6, question:'اثر سقف (Roof Effect) چه زمانی ظاهر می‌شود؟', options:['کوچک بودن نسبت Δν/J (رژیم AB)','نبود کوپلاژ','فقط در ¹³C','انقضای حلال'], answerIndex:0, explanation:'ویژگی کوانتومی طیف مرتبه دوم.' },
        { code:'A-27', cat:'cat-6', session:6, question:'کوپلاژ با دو همسایه منفرد J₁=12 و J₂=4 Hz چه الگویی می‌دهد؟', options:['dd (۴ خط هم‌شدت)','تریپلت','کوارتت','سینگلت'], answerIndex:0, explanation:'دابلتِ دابلت (dd).' },
        { code:'A-28', cat:'cat-6', session:7, question:'افزودن D₂O به نمونه چه اثری دارد؟', options:['حذف پیک پروتون‌های تبادل‌پذیر (OH, NH, COOH)','حذف آروماتیک','دو برابر شدن J','حذف CH₃'], answerIndex:0, explanation:'تبادل H با D و محو شدن پیک در ¹H-NMR.' },
        { code:'A-29', cat:'cat-6', session:7, question:'علت پهن‌شدگی ذاتی پیک N–H چیست؟', options:['آسایش چهارقطبی ¹⁴N (I=1)','رادیواکتیویته','اسپین صفر','فاصله از TMS'], answerIndex:0, explanation:'گشتاور چهارقطبی هسته نیتروژن-۱۴.' },
        { code:'A-30', cat:'cat-6', session:7, question:'روش تعیین ee% الکل کایرال در NMR چیست؟', options:['استفاده از معرف کایرال (تبدیل به دیاستریومر با شیفت متفاوت، مانند استر موشر)','نقطه ذوب','TMS زیاد','دمای ۱۰۰- بدون مشتق'], answerIndex:0, explanation:'دیاستریومرها پیک‌های مجزا با انتگرال متناسب با درصد هر انانتیومر می‌دهند.' }
      ];

      registerExamBank({ historical: HISTORICAL, examples: EXAMPLES, practice: PRACTICE });

      Router.renderExams = function (view) {
        const allSessionQuiz = COURSE_DATA.sessions.flatMap(s => s.quiz || []);
        const combinedPool = [...PRACTICE, ...allSessionQuiz];
        const allFlashcards = COURSE_DATA.sessions.flatMap(s => s.flashcards || []);
        const nmrHist = HISTORICAL.filter(h => !h.isArchive), archHist = HISTORICAL.filter(h => h.isArchive);

        view.innerHTML = `<div class="card"><h1>🎯 بانک جامع آزمون، سؤالات تاریخی و ۱۵ مثال استاد</h1>
          <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.75rem;">
            <button class="btn btn-primary btn-sm" id="eb_pr">📚 ۳۰ سؤال تألیفی (۶ دسته)</button>
            <button class="btn btn-danger btn-sm" id="eb_tm">⏱ آزمون زمان‌دار (۲۰ سؤال — قفل مرجع)</button>
            <button class="btn btn-sm" id="eb_hs">🏛 تاریخی (${nmrHist.length} NMR + ${archHist.length} بایگانی)</button>
            <button class="btn btn-sm" id="eb_ex">🔬 ۱۵ مثال حل‌شده استاد</button>
            <button class="btn btn-sm" id="eb_fc">🎴 کل فلش‌کارت‌ها (${allFlashcards.length})</button>
          </div></div><div id="examWorkspace"></div>`;
        const ws = document.getElementById('examWorkspace');

        document.getElementById('eb_pr').onclick = () => {
          ws.innerHTML = `<div class="card"><div class="tabs-bar" id="pCats"><button class="tab-btn active" data-c="all">همه ۳۰ سؤال</button>${CATS.map(c=>`<button class="tab-btn" data-c="${c.id}">${c.name}</button>`).join('')}</div><div id="pMount"></div></div>`;
          const m = ws.querySelector('#pMount');
          const go = cat => QuizEngine.start(m, { title: cat==='all'?'۳۰ سؤال تألیفی جامع':CATS.find(x=>x.id===cat).name, questions: cat==='all'?PRACTICE:PRACTICE.filter(q=>q.cat===cat), timed:false });
          ws.querySelectorAll('#pCats .tab-btn').forEach(b => b.onclick = () => { ws.querySelectorAll('#pCats .tab-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); go(b.dataset.c); });
          go('all');
        };
        document.getElementById('eb_tm').onclick = () => QuizEngine.start(ws, { title: 'آزمون شبیه‌ساز نهایی NMR (۲۰ سؤال — ۲۰ دقیقه)', questions: [...combinedPool].sort(() => Math.random() - 0.5).slice(0, 20), timed: true, durationSec: 1200 });
        document.getElementById('eb_hs').onclick = () => {
          ws.innerHTML = `<div style="margin-bottom:.75rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;"><strong>سؤالات تاریخی NMR (Q-01 تا Q-12)</strong><button class="btn btn-sm" id="tArch">📦 نمایش بایگانی غیر NMR (IR و MS: ${archHist.length})</button></div>
            ${nmrHist.map((h,i)=>`<div class="card"><div class="card-header"><div style="display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;"><span class="badge badge-info"><bdi>${h.code}</bdi></span><span class="badge ${h.status==='نیازمند بررسی'?'badge-core':'badge-success'}">${h.status}</span><button class="btn btn-sm" onclick="Router.go('session-${h.session}')">جلسه ${h.session} ↗</button></div><span class="badge badge-deep">${h.difficulty}</span></div><p style="font-weight:700;color:var(--text-primary);">${h.question}</p>${h.spectrumConfig?`<div class="hsp" data-hi="${i}"></div>`:''}<div class="callout success" style="margin-bottom:0;"><strong>پاسخ صحیح:</strong> ${h.options[h.answerIndex]}<br/><small>${h.explanation}</small></div></div>`).join('')}
            <div id="archBox" style="display:none;margin-top:1rem;"><h3>📦 بایگانی غیر NMR (IR و MS)</h3>${archHist.map(h=>`<div class="card" style="border-right:4px solid var(--text-muted);"><span class="badge badge-danger">${h.code} — ${h.status}</span><p style="font-weight:700;margin-top:.4rem;">${h.question}</p><p style="margin:0;font-size:.86rem;"><strong>پاسخ:</strong> ${h.options[h.answerIndex]} — ${h.explanation}</p></div>`).join('')}</div>`;
          ws.querySelectorAll('.hsp').forEach(el => NMRSpectrumEngine.render(el, nmrHist[Number(el.dataset.hi)].spectrumConfig));
          const ab = ws.querySelector('#tArch'), ad = ws.querySelector('#archBox');
          ab.onclick = () => { const op = ad.style.display === 'none'; ad.style.display = op ? 'block' : 'none'; ab.textContent = op ? 'بستن بایگانی غیر NMR' : `📦 نمایش بایگانی غیر NMR (IR و MS: ${archHist.length})`; };
        };
        document.getElementById('eb_ex').onclick = () => {
          ws.innerHTML = `<div class="grid-2">${EXAMPLES.map(ex=>`<div class="card" style="margin-bottom:0;display:flex;flex-direction:column;justify-content:space-between;"><div><div style="display:flex;justify-content:space-between;margin-bottom:.4rem;"><span class="badge badge-info"><bdi>${ex.code}</bdi></span><span class="badge badge-core">جلسه ${ex.session}</span></div><h3 style="font-size:.96rem;">${ex.title}</h3><div class="formula-box" style="padding:.35rem;font-size:.84rem;">${ex.formula}</div><p style="font-size:.84rem;">${ex.summary}</p></div><button class="btn btn-sm btn-primary" onclick="Router.go('session-${ex.session}')">مشاهده در جلسه ${ex.session} ←</button></div>`).join('')}</div>`;
        };
        document.getElementById('eb_fc').onclick = () => FlashcardEngine.render(ws, allFlashcards, 'کل فلش‌کارت‌های دوره (۷ جلسه)');
        document.getElementById('eb_pr').click();
      };
    })();

    /* =========================================================
       BOOTSTRAP APPLICATION
       ========================================================= */
    document.addEventListener('DOMContentLoaded', () => {
      AppState.load();
      UI.updateGlobalProgress();
      Router.renderSidebar();
      Router.renderCurrent();
      if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === 'function') window.notebookAppApi.notifyAppReady();
    });
  </script>
</body>
</html>
